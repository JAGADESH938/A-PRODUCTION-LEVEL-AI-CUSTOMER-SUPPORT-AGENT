# Global configuration for Twitter Customer Support Agent
project_name: "CustomerSupportAI"
version: "1.0.0"

paths:
  raw_data: "data/raw/twcs.csv"
  interim_data: "data/interim/"
  processed_data: "data/processed/"
  evaluation_data: "data/evaluation/"
  retrieval_index: "data/processed/retrieval_index.pkl"
  golden_set: "evaluation/golden_set.jsonl"
  intents_config: "configs/intents.yaml"
  thresholds_config: "configs/thresholds.yaml"

brand:
  # Will be set dynamically after Phase 1 brand selection
  selected_brand: "AppleSupport"

retrieval:
  top_k: 3
  similarity_metric: "cosine"
  min_similarity_threshold: 0.60

decision:
  intent_confidence_threshold: 0.75
  retrieval_confidence_threshold: 0.60
  fallback_decision: "ESCALATE"

llm:
  provider: "mock"
  model: "gpt-4o-mini"
  temperature: 0.0
  max_retries: 2
  timeout_seconds: 15
