brand: AppleSupport
intents:
- name: battery_power
  description: Issues related to fast battery drain, sudden shutdown, charging failure,
    overheating, or battery health degradation.
  keywords:
  - battery
  - drain
  - draining
  - charge
  - charging
  - charger
  - overheating
  - hot
  - dies
  - dying
  - power
  positive_examples:
  - My iPhone battery is draining from 100% to 20% in two hours after the update.
  - Why won't my iPhone charge past 80% when plugged in?
  - My phone keeps shutting off randomly with 30% battery remaining.
  - The phone gets burning hot whenever I connect the charger.
  negative_examples:
  - My screen is cracked and won't turn on.
  - How much does it cost to replace the camera lens?
  - My Wi-Fi keeps dropping in my bedroom.
  boundary_cases: If a user reports battery drain immediately following an iOS update,
    classify as battery_power if battery is the primary complaint, but software_update
    if they report the update installation failed or broke multiple apps.
  escalation_policy:
    default: auto_handle
    escalate_if:
    - swollen battery
    - smoke or physical burn danger
    - hardware replacement needed out of warranty
  historical_resolution_patterns:
  - Ask what version of iOS is installed under Settings > General > About.
  - Direct user to check Settings > Battery > Battery Health to inspect Maximum Capacity.
  - Recommend reviewing battery usage by app to spot background activity.
- name: software_update
  description: Problems updating iOS/macOS, update failed/stuck, verification errors,
    or storage space errors during update.
  keywords:
  - update
  - ios
  - updating
  - install
  - download
  - stuck
  - verifying
  - storage full
  - version
  positive_examples:
  - My iOS update has been stuck on 'Estimating time remaining' for 3 hours.
  - It says unable to verify update because I'm no longer connected to internet.
  - I don't have enough storage space to download iOS 11.
  - My phone is stuck on the Apple logo after updating last night.
  negative_examples:
  - Can I download Spotify from the App Store?
  - My battery drains faster now.
  - My AirPods won't connect.
  boundary_cases: If the phone is stuck in a bootloop / Apple logo following an update,
    diagnostic steps can be auto-handled (recovery mode), but persistent bricking
    escalates to human support.
  escalation_policy:
    default: auto_handle
    escalate_if:
    - bricked device requiring DFU restore with data loss risk
    - beta software bugs requiring developer profile assistance
  historical_resolution_patterns:
  - Recommend connecting to reliable Wi-Fi and connecting to power.
  - Advise restarting the device and trying the update through iTunes / Finder on
    Mac.
  - Provide link to Apple Support article for iOS update recovery mode.
- name: apple_id_account
  description: Account security, Apple ID login, two-factor authentication, forgotten
    password, or activation lock.
  keywords:
  - apple id
  - password
  - locked
  - login
  - account
  - verification code
  - disabled
  - two factor
  - 2fa
  - icloud
  positive_examples:
  - My Apple ID has been locked for security reasons and I can't reset it.
  - I am not receiving my 2-factor authentication code on my phone.
  - How do I recover my iCloud password if I forgot my trusted phone number?
  - My account says disabled in App Store and iTunes.
  negative_examples:
  - My screen won't swipe up.
  - Why is my monthly subscription higher than expected?
  - The YouTube app won't open.
  boundary_cases: Password reset guidance (iforgot.apple.com) is automated; but account
    takeover, compromised credentials, or disabled accounts with security holds require
    escalation.
  escalation_policy:
    default: escalate
    escalate_if:
    - identity verification required
    - account takeover or security breach
    - disabled account requiring financial/identity proof
  historical_resolution_patterns:
  - Direct customer to iforgot.apple.com for self-service password recovery.
  - For account security holds or verification failures, escalate to Apple Support
    phone/DM team.
- name: audio_bluetooth
  description: Issues with AirPods, Bluetooth accessories pairing/disconnecting, microphone,
    speaker distortion, or call audio.
  keywords:
  - bluetooth
  - airpods
  - headphones
  - sound
  - speaker
  - audio
  - mic
  - microphone
  - disconnecting
  - pair
  - pairing
  positive_examples:
  - My left AirPod has no sound coming out even though it's charged.
  - Bluetooth keeps disconnecting from my car every 5 minutes.
  - People can't hear me on phone calls unless I put them on speakerphone.
  - Static and crackling noise in my headphones.
  negative_examples:
  - My cellular connection drops.
  - The screen glass is cracked.
  - I was charged twice on my credit card.
  boundary_cases: If Bluetooth disconnects along with Wi-Fi dropping, classify as
    wifi_connectivity if network chip/settings are the culprit.
  escalation_policy:
    default: auto_handle
    escalate_if:
    - hardware failure of speaker/mic requiring repair
    - lost single AirPod replacement request
  historical_resolution_patterns:
  - Instruct user to forget device in Settings > Bluetooth and re-pair.
  - Provide steps to reset AirPods (press and hold setup button on back of case).
  - Suggest testing voice memos to isolate hardware microphone vs app permissions.
- name: screen_hardware
  description: Physical damage, cracked screen, unresponsive touchscreen, display
    glitches, camera hardware, or Genius Bar repair booking.
  keywords:
  - screen
  - cracked
  - broken
  - display
  - touch
  - unresponsive
  - repair
  - genius bar
  - store
  - appointment
  - camera
  - lines
  positive_examples:
  - I dropped my iPhone and the screen is shattered, how do I get it fixed?
  - The touch screen is completely unresponsive on the right half.
  - There are vertical green lines across my display.
  - How do I make an appointment at the Apple Store Genius Bar?
  negative_examples:
  - My phone is slow when browsing Safari.
  - My battery is draining quickly.
  - I forgot my Apple ID password.
  boundary_cases: If touchscreen freeze is caused by a frozen app, reboot guidance
    is auto-handled; if physical glass crack or digitizer hardware failure, escalate
    to repair booking.
  escalation_policy:
    default: escalate
    escalate_if:
    - physical repair quotation needed
    - warranty/AppleCare+ claim processing
    - in-person Genius Bar scheduling
  historical_resolution_patterns:
  - Provide Apple Support App link or locate.apple.com to book a Genius Bar appointment.
  - Inform customer to back up device before bringing it in for screen repair.
- name: wifi_cellular
  description: Wi-Fi disconnecting/not joining, cellular 'No Service' / 'Searching',
    dropped calls, or mobile data issues.
  keywords:
  - wifi
  - wi-fi
  - cellular
  - service
  - signal
  - data
  - lte
  - 4g
  - carrier
  - sim
  - searching
  - no service
  positive_examples:
  - My phone keeps showing 'No Service' even with my SIM card inserted.
  - Wi-Fi toggle is greyed out in Settings.
  - My phone connects to Wi-Fi but says 'No Internet Connection'.
  - Cellular data stops working unless I toggle Airplane Mode.
  negative_examples:
  - AirPods won't connect to Bluetooth.
  - Battery dies in 3 hours.
  - My Apple ID is locked.
  boundary_cases: If carrier-specific network outage (e.g. AT&T or Verizon down),
    advise contacting carrier; if device network settings issue, guide reset network
    settings.
  escalation_policy:
    default: auto_handle
    escalate_if:
    - greyed-out Wi-Fi indicating baseband hardware failure
    - SIM failure requiring carrier or hardware replacement
  historical_resolution_patterns:
  - Advise toggling Airplane Mode on for 30 seconds and off.
  - Instruct user to perform Reset Network Settings in Settings > General > Reset.
  - Check for Carrier Settings Update in Settings > General > About.
- name: billing_subscriptions
  description: App Store charges, unauthorized purchases, subscription cancellations,
    refund requests, or credit card payment declines.
  keywords:
  - charge
  - charged
  - billing
  - bill
  - refund
  - subscription
  - purchase
  - receipt
  - card
  - money
  - payment
  - itunes
  positive_examples:
  - I was charged $9.99 for a subscription I cancelled last week.
  - There is an unauthorized purchase on my credit card from iTunes.
  - How do I request a refund for an app that doesn't work?
  - My payment method was declined in the App Store.
  negative_examples:
  - How do I download the latest iOS update?
  - My screen is cracked.
  - AirPods sound crackly.
  boundary_cases: Guiding the user to reportaproblem.apple.com for self-service refund
    requests is automated; processing financial disputes or investigating credit card
    fraud escalates to human agents.
  escalation_policy:
    default: escalate
    escalate_if:
    - financial dispute or chargeback
    - unauthorized card fraud
    - refund status inquiries requiring account lookup
  historical_resolution_patterns:
  - Direct customer to reportaproblem.apple.com to review purchase history and submit
    refund claims.
  - Explain how to manage and cancel subscriptions under Settings > [User Name] >
    Subscriptions.
  - Escalate to billing support specialist via DM or phone for disputed transactions.
- name: app_system_performance
  description: App crashes, freezing, sluggish system UI, keyboard lag, storage full
    warnings, or camera app black screen.
  keywords:
  - app
  - apps
  - crash
  - crashing
  - freeze
  - freezing
  - lag
  - slow
  - sluggish
  - black screen
  - camera
  - storage
  positive_examples:
  - Instagram and Twitter keep crashing to home screen immediately upon opening.
  - The keyboard has a terrible 2-second lag when typing messages.
  - My camera app just shows a black screen when I open it.
  - Phone is running extremely slow and unresponsive.
  negative_examples:
  - My screen glass is shattered.
  - I was billed twice for Apple Music.
  - My battery dies quickly.
  boundary_cases: If app crashes occur only on one third-party app, advise updating
    app or contacting third-party dev; if system-wide freeze, guide force restart.
  escalation_policy:
    default: auto_handle
    escalate_if:
    - kernel panics / spontaneous reboots persisting after factory restore
    - hardware camera sensor failure
  historical_resolution_patterns:
  - Instruct user on how to force close the app and restart device.
  - Guide user to check for app updates in the App Store.
  - Recommend checking available storage in Settings > General > iPhone Storage.
- name: general_inquiry_feedback
  description: General questions about product features, device compatibility, trade-in
    values, retail store hours, or feedback.
  keywords:
  - trade in
  - compatible
  - compatibility
  - feature
  - store hours
  - price
  - when will
  - feedback
  - how to
  positive_examples:
  - Does the Apple Watch Series 3 work with iPhone 6?
  - What is the trade-in value for an iPhone 7 in good condition?
  - What time does the Fifth Avenue Apple Store close today?
  - Can I use two different eSIM profiles on the same device?
  negative_examples:
  - My battery is draining.
  - I was charged for an app I didn't buy.
  - AirPod sound is muffled.
  boundary_cases: General specification and policy questions can be auto-handled using
    official guidelines; trade-in appraisal disputes or order cancellations escalate.
  escalation_policy:
    default: auto_handle
    escalate_if:
    - trade-in dispute or lost shipment
    - complaints requiring managerial escalation
  historical_resolution_patterns:
  - Provide official Apple specs or support page link.
  - Direct customer to apple.com/retail for store hours and Genius Bar availability.
